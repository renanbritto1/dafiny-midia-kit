<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 95" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&amp;family=Outfit:wght@700;800;900&amp;display=swap');
      .cr-main { font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 37px; letter-spacing: 0.2px; }
      .cr-banner { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 2px; }
    </style>
  </defs>
  
  <!-- Top decorative line & flourish -->
  <line x1="14" y1="13" x2="95" y2="13" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45" />
  <path d="M 98 13 C 106 8, 112 4, 118 12 C 124 19, 132 5, 135 13 C 138 5, 146 19, 152 12 C 158 4, 164 8, 172 13" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
  <circle cx="135" cy="5" r="2.2" fill="#FFAE19" />
  <line x1="175" y1="13" x2="256" y2="13" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45" />

  <!-- Brand Name -->
  <text x="135" y="52" class="cr-main" fill="#FFFFFF" text-anchor="middle">Casa da Roça</text>

  <!-- Golden ribbon banner -->
  <g transform="translate(18, 62)">
    <!-- Left notched tail -->
    <polygon points="0,15 -8,6 0,-3 12,-3 12,15" fill="#D98804" />
    <!-- Right notched tail -->
    <polygon points="234,15 242,6 234,-3 222,-3 222,15" fill="#D98804" />
    <!-- Center ribbon body -->
    <rect x="8" y="-4" width="218" height="21" rx="2" fill="#FFAE19" />
    <text x="117" y="10" class="cr-banner" fill="#3D1C04" text-anchor="middle">COMIDA DE VERDADE</text>
  </g>
</svg>
